    id:a.id||"",
    name:a.name||"",
    tag:a.tagName,
    typ:a.type||"",
    value:a.value,
    start:typeof a.selectionStart==="number"?a.selectionStart:null,
    end:typeof a.selectionEnd==="number"?a.selectionEnd:null
  };
}
function restoreTyping(keep){
  if(!keep)return;
  let el=keep.id?document.getElementById(keep.id):null;
  if(!el)return;
  el.focus({preventScroll:true});
  try{if(keep.start!=null)el.setSelectionRange(keep.start,keep.end)}catch(e){}
}
function render(opts){
  opts=opts||{};
  if(ui._sheetLeaving && !opts.forceLeave) return;
  const scroller=document.querySelector("main")||document.querySelector(".page");
  const keepY=scroller?scroller.scrollTop:0;
  const keep=typingTarget();
  if(keep && !opts.force && !opts.fromInput){
    renderHeld=true;
    return;
  }
  const main=document.querySelector(".main");
  const y=main?main.scrollTop:0;
  const el=document.getElementById("app");
  if(!S.userId||!sessionTok){try{document.documentElement.classList.remove("sheet-open")}catch(e){}el.innerHTML=loginView();restoreTyping(opts.fromInput?keep:null);return}
  const pages={home:homeView,patients:patientsView,snap:snapView,record:recordView,handover:handoverView,ect:ectView,tasks:tasksView,setup:setupView,activity:activityView,ward:wardView,census:censusView,observe:observeView,more:moreView,users:usersView,about:aboutView,connection:connectionView,broadcast:broadcastView};
  syncRoute();
  const sheetOpen=overlayOpen();
  const depth=overlayDepth();
  ui._sheetEnter=sheetOpen && depth>(ui._overlayDepthWas||0);
  ui._overlayDepthWas=depth;
  ui._sheetWasOpen=sheetOpen;
  try{document.documentElement.classList.toggle("sheet-open", !!sheetOpen)}catch(e){}
  let _html=shell((pages[route.page]||patientsView)());
  if(ui._sheetEnter) _html=stampSheetEnter(_html);
  el.innerHTML=_html;
  ui._sheetEnter=false;
  try{ if(ui.giveOpen) refreshGivePost(); }catch(e){}
  (function syncNavClearance(){
    try{
      const nav=el.querySelector(".nav");
      if(!nav) return;
      const h=Math.ceil(nav.getBoundingClientRect().height);
      if(h>40) document.documentElement.style.setProperty("--nav-h", h+"px");
    }catch(e){}
  })();
  if(sessionTok&&!ui.notifyInboxLoading&&(!ui.notifyInboxLoadedAt||Date.now()-ui.notifyInboxLoadedAt>60000)){
    loadNotificationInbox().catch(()=>{});
  }
  const main2=document.querySelector(".main");
  if(main2){
    if(opts.nav){
      if(navDir==="back"){
        const saved=navScroll[routeKey(route.page,route.id)];
        main2.scrollTop=saved||0;
      }else{
        main2.scrollTop=0;
      }
    }else main2.scrollTop=y;
    if(navAnim){
      main2.classList.remove("fwd","back");
      void main2.offsetWidth;
      main2.classList.add(navDir==="back"?"back":"fwd");
      navAnim=false;
    }
  }
  try{if(!history.state||history.state.tab!==nav.tab) history.replaceState({tab:nav.tab,stack:nav.stack.map(x=>({page:x.page,id:x.id||null}))},"",navHash())}catch(e){}
  if(opts.fromInput) restoreTyping(keep);
  renderHeld=false;
}
let focusFlush=null;
function cancelFocusFlush(){if(focusFlush){clearTimeout(focusFlush);focusFlush=null}}
function isTypeField(el){return !!(el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)&&el.type!=="button"&&el.type!=="submit")}
document.addEventListener("focusin",(e)=>{
  if(isTypeField(e.target)) cancelFocusFlush();
});
document.addEventListener("pointerdown",(e)=>{
  if(isTypeField(e.target)||(e.target&&e.target.closest&&e.target.closest("input,textarea,select"))) cancelFocusFlush();
},true);
document.addEventListener("focusout",(e)=>{
  const next=e.relatedTarget;
  if(isTypeField(next)) return;
  cancelFocusFlush();
  focusFlush=setTimeout(()=>{
    focusFlush=null;
    if(typingTarget()) return;
    if(renderHeld) render({force:true});
  },480);
});


document.addEventListener("pointerdown",e=>{
  const b=e.target.closest("button");
  if(!b)return;
  if(Feedback.prefs().sound)Feedback.unlockAudio();
},true);
document.addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(!b)return;
  Feedback.tap(b);
  b.classList.add("pulse");
  setTimeout(()=>b.classList.remove("pulse"),400);
},true);
window.addEventListener("online",()=>{if(cloudOn()){Sync.state="RECONNECTING";cloudBoot().finally(()=>render())}});
window.addEventListener("offline",()=>{cloudStatus="offline";liveReady=false;Sync.state="OFFLINE";Sync.note("browser offline");render()});
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){
    Sync.note("background");
    return;
  }
  if(cloudOn()){
    Sync.note("resume");
    if(!liveReady) scheduleReconnect();
    else cloudPull().then(()=>render()).catch(()=>scheduleReconnect());
    if(pending.length) flushPending().catch(()=>{});
  }
});
window.addEventListener("focus",()=>{if(cloudOn()&&!liveReady)scheduleReconnect()});
if(!navigator.onLine){cloudStatus="offline";Sync.state="OFFLINE"}
render();
cloudBoot().finally(()=>render());
setInterval(()=>{
  if(document.visibilityState!=="visible"||!cloudOn())return;
  if(!liveReady && navigator.onLine) scheduleReconnect();
},45000);


if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((err) => console.warn("SW", err));
  });
}
</script>
</body>
</html>
