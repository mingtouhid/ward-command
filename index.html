<script>
(function(){
  var t="dark";
  try{t=localStorage.getItem("ward-command-theme")||"dark"}catch(e){}
  document.documentElement.setAttribute("data-theme",t);
  document.documentElement.style.colorScheme=t;
})();

/* V85.5_CRITICAL_STATUS_RETENTION */
(function(){
  const KEY='ward-command-critical-status-updates-v1';

  function loadCriticalStatusUpdates(){
    try { return JSON.parse(localStorage.getItem(KEY)||'[]'); }
    catch(e){ return []; }
  }
  function saveCriticalStatusUpdates(rows){
    localStorage.setItem(KEY, JSON.stringify(rows.slice(0,500)));
  }
  window.wardCriticalStatus = {
    list: function(patientId){
      return (S.criticalStatusUpdates||[])
        .filter(x=>String(x.pid)===String(patientId))
        .sort((a,b)=>{const da=criticalTime(a), db=criticalTime(b); return (db?Date.parse(db):0)-(da?Date.parse(da):0);});
    }
  };

  function esc(s){
    return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function formatDate(s){
    const d=new Date(s);
    if(Number.isNaN(d.getTime())) return "Date unavailable";
    return d.toLocaleString([],{
      day:'2-digit',month:'short',year:'numeric',
      hour:'2-digit',minute:'2-digit'
    });
  }
  function criticalAuthor(r){
    if(r.byName && r.byName!=='Clinician') return r.byName;
    if(r.created_by_name && r.created_by_name!=='Clinician') return r.created_by_name;
    const id=r.by||r.created_by;
    const resident=(S.residents||[]).find(x=>String(x.id)===String(id));
    return resident?.displayName || resident?.username || id || 'Clinician';
  }
  function criticalTime(r){
    const candidates=[r.at,r.created_at,r.createdAt];
    for(const value of candidates){
      if(value){const d=new Date(value);if(!Number.isNaN(d.getTime())) return d.toISOString();}
    }
    return null;
  }

  window.renderCriticalStatusHistory=function(patientId){
    const rows=window.wardCriticalStatus.list(patientId);
    if(!rows.length) return `<p class="tiny" style="margin-top:8px">None yet</p>`;
    const latest=rows[0];
    const more=rows.length-1;
    return `<div class="crit-item">
        <p class="crit-msg">${esc(latest.message)}</p>
        <div class="crit-meta"><span>${esc(criticalAuthor(latest))}</span><span>${esc(formatDate(criticalTime(latest)))}</span></div>
        ${more>0?`<button class="btn ghost sm" onclick="openCriticalHistory('${esc(patientId)}')">Earlier · ${more}</button>`:""}
      </div>`;
  };
  window._criticalRowsHtml=function(patientId){
    const rows=window.wardCriticalStatus.list(patientId);
    if(!rows.length) return `<p class="sm">None yet</p>`;
    return `<div class="crit-list">${rows.map((r,i)=>`
      <div class="crit-item ${i===0?"":"earlier"}">
        <p class="tiny" style="margin:0 0 4px">${i===0?"Latest":"Earlier"}</p>
        <p class="crit-msg">${esc(r.message)}</p>
        <div class="crit-meta"><span>${esc(criticalAuthor(r))}</span><span>${esc(formatDate(criticalTime(r)))}</span></div>
      </div>`).join("")}</div>`;
  };

})();


/* V85.5_CRITICAL_STATUS_SNAPSHOT_UI */
(function(){
  function patientIdFromPage(){
    const candidates=[
      window.currentPatient?.id,
      window.selectedPatient?.id,
      window.activePatient?.id,
      window.currentPatientId,
      window.selectedPatientId
    ];
    for(const x of candidates) if(x) return String(x);
    const el=document.querySelector('[data-patient-id]');
    return el?.getAttribute('data-patient-id')||null;
  }
  function mount(){
    const pid=patientIdFromPage();
    if(!pid || !window.renderCriticalStatusHistory) return;
    const host=document.querySelector('#critical-status-history');
    if(host){
      host.innerHTML=window.renderCriticalStatusHistory(pid);
      return;
    }
    // Prefer a patient Snapshot container if one is identifiable.
    const snap=document.querySelector('.patient-snapshot, #patient-snapshot, [data-view="snapshot"]');
    if(!snap) return;
    const wrap=document.createElement('section');
    wrap.id='critical-status-history';
    wrap.style.marginTop='14px';
    wrap.innerHTML='<h3 style="margin:0 0 8px">Critical Status Updates</h3>'+window.renderCriticalStatusHistory(pid);
    snap.appendChild(wrap);
  }
  const oldPush=history.pushState;
  history.pushState=function(){ const r=oldPush.apply(this,arguments); setTimeout(mount,0); return r; };
  window.addEventListener('hashchange',()=>setTimeout(mount,0));
  const observer=new MutationObserver(()=>{ if(!document.querySelector('#critical-status-history')) mount(); });
  observer.observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(mount,500);
})();


</script>

function openOutboxDb(){

    if(!window.indexedDB) return reject(new Error("no-idb"));
    const req=indexedDB.open(OUTBOX_DB,1);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(OUTBOX_STORE)) db.createObjectStore(OUTBOX_STORE);

  });

function idbGetOutbox(){

    const tx=db.transaction(OUTBOX_STORE,"readonly");
    const q=tx.objectStore(OUTBOX_STORE).get("pending");
    q.onsuccess=()=>resolve(Array.isArray(q.result)?q.result:null);
    q.onerror=()=>reject(q.error);
  }));
}

    const top=nav.stack[nav.stack.length-1];
    route={page:top.page,id:top.id||null};
  } else route={page:tabRoot(nav.tab),id:null};
  return route;
}
function navHash(){
  const r=syncRoute();
  return "#/"+(r.page||"home")+(r.id?"/"+encodeURIComponent(r.id):"");
}
function applyNavState(st){
  if(!st||!st.tab)return false;
  nav.tab=st.tab;
  nav.stack=Array.isArray(st.stack)?st.stack.map(x=>({page:x.page,id:x.id||null})):[]
  syncRoute();
  return true;
}

function flags(p){
  const sn=S.snaps[p.id]||{};
  const due=dueFor(p.id).length;
  const t=openTasks(p.id).length;
  const risk=sn.risk||"low";
  return {
    risk,
    med: due? "bad":"ok",
    sleep: sn.sleep==="insomnia"||sn.sleep==="broken"?"warn":"ok",
    task: t?"warn":"ok",
    due, t
  };
}

function routeKey(page,id){return String(page||"home")+"::"+String(id||"")}
function snapshotScroll(){
  const m=document.querySelector(".main");
  if(!m) return;
  navScroll[routeKey(route.page,route.id)]=m.scrollTop;
}
function go(page,id){
  if(ui._sheetLeaving){ui._sheetLeaving=false;try{document.documentElement.classList.remove("sheet-open")}catch(e){}}
  snapshotScroll();
  id=id||null;
  const tab=PAGE_TAB[page]||"home";
  if(tab!==nav.tab){nav.tab=tab;nav.stack=[]}
  if(page===tabRoot(tab)&&!id) nav.stack=[];
  else {
    const top=nav.stack[nav.stack.length-1];
    if(!(top&&top.page===page&&String(top.id||"")===String(id||""))) nav.stack.push({page,id});
  }
  ui.sheet=null;
  ui.panel=null;
  ui.giveOpen=false;
  if(page!=="broadcast") ui._bcastHydrated=0;
  if(ui.busy){ui.busy=false;ui.busyLabel="";}
  navDir="fwd";navAnim=true;
  syncRoute();
  try{history.pushState({tab:nav.tab,stack:nav.stack.map(x=>({page:x.page,id:x.id||null}))},"",navHash())}catch(e){}
  render({force:1,nav:1});
}
function back(){
  if(ui.pick||ui.sheet||ui.confirm||ui.panel||ui.giveOpen||ui.notifySet||ui.userEdit||ui.consEdit){dismissOverlay();return}
  snapshotScroll();
  if(nav.stack.length){
    nav.stack=nav.stack.slice(0,-1);
    if(ui.busy){ui.busy=false;ui.busyLabel="";}
    navDir="back";navAnim=true;
    syncRoute();
    try{history.pushState({tab:nav.tab,stack:nav.stack.map(x=>({page:x.page,id:x.id||null}))},"",navHash())}catch(e){}
    render({force:1,nav:1});
    return;
  }
  if(nav.tab!=="home") go("home");
}
window.addEventListener("popstate",e=>{
  snapshotScroll();
  if(applyNavState(e.state)){if(ui._sheetLeaving)ui._sheetLeaving=false;clearOverlayState();render({force:1,nav:1});return}

function cloudOn(){return !!(S.supabaseUrl&&S.supabaseAnonKey&&/^https:\/\//i.test(S.supabaseUrl)&&window.supabase)}
function liveOutboxCount(){return pending.filter(op=>op.status!=="acked"&&op.status!=="failed").length}
function failedOutboxCount(){return pending.filter(op=>op.status==="failed").length}
function statusLabel(){
  const live=liveOutboxCount(), fail=failedOutboxCount();
  if(!navigator.onLine) return live?"Offline · "+live:"Offline";
  if(fail) return "Needs attention · "+fail;
  if(live) return "Saving · "+live;
  if(Sync.state==="RECONNECTING") return "Reconnecting";
  if(cloudStatus==="live" || Sync.state==="CONNECTED" || liveReady) return "Live";
  if(sessionTok) return "Connecting";
  if(Sync.state==="ERROR" || cloudStatus==="error") return "Offline";
  if(Sync.state==="CONNECTING") return "Connecting";
  return "Ready";
}
function statusClass(){
  if(failedOutboxCount() || (cloudStatus==="error"&&sessionTok&&failedOutboxCount())) return "error";
  if(failedOutboxCount()) return "error";
  if(!navigator.onLine) return "offline";
  if(Sync.state==="ERROR" || cloudStatus==="error") return "offline";
  if(liveOutboxCount() || Sync.state==="RECONNECTING") return "syncing";
  if(cloudStatus==="live"||Sync.state==="CONNECTED"||liveReady) return "live";
  if(sessionTok || Sync.state==="CONNECTING") return "syncing";
  return "offline";
}

function cloudConnect(){

  if(sb && sbFingerprint===fp) return sb;
  try{
    if(sb&&liveChan){try{sb.removeChannel(liveChan)}catch(e){}}
    liveChan=null; liveReady=false; Sync.listening=false;
    sb=window.supabase.createClient(S.supabaseUrl.trim(),S.supabaseAnonKey.trim(),{
      auth:{persistSession:false,autoRefreshToken:false},

    });
    sbFingerprint=fp;
    Sync.note("client created");
  }catch(e){sb=null;sbFingerprint="";cloudStatus="error";cloudLastError=String(e);return}

async function upsert(table,rows){
  if(!rows.length)return;
  if(!sessionTok){
    throw new Error("Sign in again to sync writes");
  }
  for(const raw of rows){
    const row=stampRow(table,raw);
    let error;
    if(table==="beds"){
      if(row.bed_number&&row.section_id){
        ({error}=await sb.rpc("ward_upsert_bed",{p_token:sessionTok,p_row:row}));
      }else{
        ({error}=await sb.rpc("ward_set_bed",{p_token:sessionTok,p_id:row.id,p_patient:row.current_patient_id||""}));
      }
    }else if(table==="patients"){
      ({error}=await sb.rpc("ward_upsert_patient",{p_token:sessionTok,p_row:row}));
    }else if(table==="medication_orders"){
      ({error}=await sb.rpc("ward_upsert_medication_order",{p_token:sessionTok,p_row:row}));
    }else if(table==="medication_doses"){
      ({error}=await sb.rpc("ward_record_medication_dose",{p_token:sessionTok,p_row:row}));
    }else if(table==="ect_plans"){
      ({error}=await sb.rpc("ward_upsert_ect_plan",{p_token:sessionTok,p_row:row}));
    }else if(table==="ect_sessions"){
      ({error}=await sb.rpc("ward_record_ect_session",{p_token:sessionTok,p_row:row}));
    }else if(table==="activity_log"){
      // activity_log.actor_id is derived server-side from the authenticated
      // ward session.
      ({error}=await sb.rpc("ward_write_activity_log",{p_token:sessionTok,p_row:row}));
    }else if(table==="patient_bed_assignments"){
      ({error}=await sb.rpc("ward_upsert_patient_bed_assignment",{p_token:sessionTok,p_row:row}));
    }else if(table==="handovers"){
      if((row.status||"")==="withdrawn"){
        ({error}=await sb.rpc("ward_withdraw_handover",{p_session_token:sessionTok,p_handover_id:row.id}));
      }else{
        ({error}=await sb.rpc("ward_upsert_handover",{p_session_token:sessionTok,p_row:row}));
      }
    }else if(table==="handover_items"){
      ({error}=await sb.rpc("ward_upsert_handover_item",{p_session_token:sessionTok,p_row:row}));
    }else if(table==="tasks"){
      ({error}=await sb.rpc("ward_upsert_task",{p_session_token:sessionTok,p_row:row}));
    }else if(table==="ward_sections"){
      ({error}=await sb.rpc("ward_upsert_section",{p_token:sessionTok,p_row:row}));
    }else if(table==="unit_consultants"){
      ({error}=await sb.rpc("ward_upsert_consultant",{p_token:sessionTok,p_row:row}));
    }else if(table==="unit_settings"){
      ({error}=await sb.rpc("ward_upsert_unit_settings",{p_token:sessionTok,p_row:row}));
    }else if(table==="restrain_toggle"){
      ({error}=await sb.rpc("ward_toggle_restrain",{
        p_token:sessionTok,
        p_patient_id:row.patient_id||row.pid,
        p_on:!!row.on,
        p_event_id:row.event_id||row.id||"",
        p_detail:row.detail||null
      }));
    }else if(table==="snapshot_field"){
      ({error}=await sb.rpc("ward_patch_snapshot_field",{
        p_token:sessionTok,
        p_patient_id:row.patient_id||row.pid,
        p_field:row.field,
        p_value:row.value==null?"":String(row.value),
        p_seen_version:row.seen_version==null?null:Number(row.seen_version)
      }));
    }else if(table==="snapshot_tag"){
      ({error}=await sb.rpc("ward_patch_snapshot_tags",{
        p_token:sessionTok,
        p_patient_id:row.patient_id||row.pid,
        p_tag:row.tag,
        p_op:row.op||"add"
      }));

      ({error}=await sb.rpc("ward_append_pgt_note",{

      }));

      throw new Error("This action has no approved write path.");

    if(error){

      throw new Error(clinicianCopy(msg, table));
    }
  }
}

function asDate(v){
  if(!v)return null;
  const s=String(v);
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const d=new Date(v);return isNaN(d)?null:d.toISOString().slice(0,10);
}

function isStaleOutbox(op){
  if(!op) return false;
  const msg=String(op.lastError||"").toLowerCase();
  const row=op.row||{};
  const p=outboxPatient(op);
  if(op.table==="handovers"){
    const from=row.from_id||row.from;
    if(from && S.userId && String(from)!==String(S.userId)) return true;
    if(/handover sender must be|posted by another resident/.test(msg)) return true;
  }
  if(/only the receiving resident/.test(msg)) return true;
  const gone=/no longer on the ward|active patient not found|patient is required|that patient is no longer/.test(msg);
  if(gone) return true;
  if(p&&p.status==="discharged" && ["tasks","ect_plans","handover_items","medication_orders","medication_doses","patient_snapshots","snapshot_field","snapshot_tag","pgt_note","restrain_toggle"].includes(op.table)) return true;
  if(!p && ["tasks","ect_plans","handover_items","snapshot_field","snapshot_tag","pgt_note","restrain_toggle"].includes(op.table)) return true;
  if(/already restrained|not restrained|stale/.test(msg) && ["restrain_toggle","snapshot_field"].includes(op.table)) return true;
  return false;
}
function dropOutboxItem(id){

}
function dropStaleOutbox(){

async function doFlushPending(){
  if(!sb||!pending.length) return;
  if(!sessionTok){cloudStatus="error";return}
  pending.filter(isStaleOutbox).forEach(op=>{
    Sync.note("drop stale "+op.table);
    ackOutbox(op.id);
  });
  const work=pending.filter(op=>op.status!=="acked"&&!isStaleOutbox(op));
  if(!work.length){
    if(!pending.length && liveReady){cloudStatus="live";Sync.state="CONNECTED"}
    return;
  }
  cloudStatus="syncing";
  Sync.state="RECONCILING";
  const rank=t=>({patients:0,beds:1,patient_bed_assignments:2,restrain_toggle:3,snapshot_tag:4,pgt_note:5,snapshot_field:6,patient_snapshots:7,medication_orders:8,medication_doses:9,ect_plans:10,ect_sessions:11,tasks:12,handovers:13,handover_items:14,ward_sections:15,unit_consultants:16,unit_settings:17,activity_log:20}[t]??18);
  work.sort((a,b)=>rank(a.table)-rank(b.table));
  let hard=false;
  for(const op of work){
    if(!pending.find(x=>x.id===op.id)) continue;
    if(op.status==="failed" && (op.tries||0)>=8){
      patchOutbox(op.id,{status:"retrying",tries:0,lastAttemptAt:now(),lastError:""});
    }
    const row=Object.assign({},op.row);
    if(op.table==="patient_snapshots"){row.patient_id=row.patient_id||row.id; delete row.id}
    patchOutbox(op.id,{status:"retrying",lastAttemptAt:now(),tries:(op.tries||0)+1});
    try{
      await upsert(op.table,[row]);
      Sync.lastServer=now();
      Sync.note("write "+op.table+" acked");
      ackOutbox(op.id);
    }catch(e){
      const msg=e&&e.message||String(e);
      const tries=(pending.find(x=>x.id===op.id)||op).tries||1;
      if(sessionDead(msg)){
        expireSession();
        patchOutbox(op.id,{status:"failed",lastError:msg});
        hard=true; cloudLastError=msg; break;
      }
      if(isStaleOutbox(Object.assign({},op,{lastError:msg}))){
        Sync.note("drop stale after error "+op.table);
        ackOutbox(op.id);
        continue;
      }
      if(tries>=8){
        patchOutbox(op.id,{status:"failed",lastError:msg});
        // Never create another activity_log row while activity_log itself
        // is failing; that would recursively grow the outbox.
        if(op.table==="activity_log"){
          pushElog("activity_log failed kept: "+msg,"bad");
        }else{
          evFail(row.patient_id||row.id||null, op.table, msg);
        }
        Sync.note("write "+op.table+" failed kept");
      }else{
        patchOutbox(op.id,{status:"pending",lastError:msg});
      }
    }
  }
  persistOutbox();
  const c=outboxCounts();
  if(hard){cloudStatus="error";Sync.state="ERROR"}
  else if(c.failed){cloudStatus="error";Sync.state="ERROR"}
  else if(pending.length){cloudStatus="syncing";Sync.state="RECONCILING"}
  else if(liveReady){cloudStatus="live";Sync.state="CONNECTED"}
  if(reconciliationNeeded && !pending.filter(o=>o.status!=="failed").length){
    reconciliationNeeded=false;
    Sync.note("deferred realtime reconcile");
    await cloudPull();
  }
}

let liveChan=null, liveReady=false, pullTimer=null;
function onRealtimeEvent(table,payload){
  Sync.lastRealtime=now();
  Sync.note("event "+table+" "+((payload&&payload.eventType)||"*"));
  const busy=applyingRemote||pending.filter(o=>o.status!=="failed").length;
  if(busy){reconciliationNeeded=true;Sync.note("realtime event deferred; reconciliation needed");return}
  clearTimeout(pullTimer);
  pullTimer=setTimeout(()=>{
    cloudPull().then(r=>{
      if(r&&r.ok&&liveReady){cloudStatus="live";Sync.state="CONNECTED"}
      render();
    }).catch(e=>{cloudLastError=e.message||String(e);cloudStatus="error";Sync.state="ERROR";render()});
  },500);
}
function cloudListen(){
  if(!sb)return;
  if(Sync.listening && liveChan && liveReady){Sync.note("listen already active");return}
  if(liveChan){try{sb.removeChannel(liveChan)}catch(e){}}
  liveReady=false; Sync.listening=false;
  const tables=["critical_status_updates","activity_log","patient_snapshots","beds","patients","medication_doses","medication_orders","ect_plans","handovers","handover_items","tasks","patient_bed_assignments","ward_sections","unit_consultants"];
  liveChan=sb.channel("ward-command-live");
  tables.forEach(table=>{
    liveChan.on("postgres_changes",{event:"*",schema:"public",table},payload=>onRealtimeEvent(table,payload));
  });
  liveChan.subscribe(status=>{
    Sync.lastRealtime=now();
    if(status==="SUBSCRIBED"){
      liveReady=true; Sync.listening=true; Sync.reconnects=0; Sync.note("realtime SUBSCRIBED");
      cloudPull().then(()=>{
        const c=outboxCounts();
        if(c.failed){cloudStatus="error";Sync.state="ERROR"}
        else if(c.pending||c.retrying){cloudStatus="syncing";Sync.state="CONNECTED"}
        else {cloudStatus="live";Sync.state="CONNECTED"}
        render();
      }).catch(()=>render());
    } else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED"){
      liveReady=false; Sync.listening=false;
      cloudStatus="offline"; Sync.state="RECONNECTING";
      Sync.note("realtime "+status);
      scheduleReconnect();
      render();
    }
  });
}
function scheduleReconnect(){
  if(!navigator.onLine||document.visibilityState==="hidden")return;
  const delays=[1000,2000,5000,10000,20000,30000,60000];
  const n=Math.min(Sync.reconnects,delays.length-1);
  const jitter=Math.floor(Math.random()*400);
  clearTimeout(window._reconn);
  window._reconn=setTimeout(()=>{
    Sync.reconnects++;
    Sync.note("reconnect attempt "+Sync.reconnects);
    cloudBoot().finally(()=>render());
  },delays[n]+jitter);
}
async function cloudBoot(){
  if(syncBootPromise) return syncBootPromise;
  syncBootPromise=doCloudBoot().finally(()=>{syncBootPromise=null});
  return syncBootPromise;
}
async function doCloudBoot(){
  if(!navigator.onLine){cloudStatus="offline";Sync.state="OFFLINE";return false}
  cloudConnect();
  if(!sb){cloudStatus="offline";Sync.state="OFFLINE";return false}
  if(!sessionTok){
    cloudStatus="offline";
    Sync.state="CONNECTING";
    Sync.note("waiting for sign-in");
    cloudConnect();
    return false;
  }
  cloudStatus="syncing";
  Sync.state="CONNECTING";
  Sync.note("boot");
  try{
    await flushPending();
    cloudListen();
    const r=await cloudPull();
    if(r&&r.ok) Sync.state=liveReady?"CONNECTED":"CONNECTING";
    cloudStatus=liveReady?(outboxCounts().failed?"error":"live"):"syncing";
    return true;
  }catch(e){
    cloudLastError=e.message||String(e);
    cloudStatus="error";
    Sync.state="ERROR";
    Sync.note("boot fail "+cloudLastError);
    scheduleReconnect();
    return false;
  }
}

async function doLogin(e){
  e.preventDefault();
  if(ui.loginBusy) return;
  const username=val("u").trim().toLowerCase();
  const pw=val("pw");
  ui.loginErr="";
  if(!username||!pw){ui.loginErr="Enter username and password."; render(); return}
  ui.loginBusy=true; render();
  try{
    cloudConnect();
    if(sb){
      try{
        const res=await cloudLogin(username,pw);
        if(res&&res.ok===false){
          ui.loginErr=res.error==="unknown_user"?"Unknown username":"Wrong password";
          return;
        }
        if(res&&res.ok&&res.resident){
          S.userId=res.resident.id;sessionPw=pw;setSessionTok(res.token||res.session||null);
          await cloudPull().catch(()=>{});
          await loadServerNotifyPrefs().catch(()=>{});
          if(res.resident.role){const rr=S.residents.find(x=>x.id===S.userId);if(rr) rr.role=res.resident.role;}
          save();
          cloudListen();
          ui.loginBusy=false; ui.loginErr="";
          go("home");
          return;
        }
      }catch(err){
        console.warn("cloud login fallback",err);
      }
    }
    ui.loginErr="Cannot reach the ward server. Sign in when Live.";
  }finally{
    ui.loginBusy=false;
    if(!sessionTok) render();
  }
}

function explainSyncError(msg){
  const s=String(msg||"").toLowerCase();
  if(s.includes("assignments_one_open_patient")) return "The database already has an open bed assignment for this patient. The server rejected this write to preserve the one-open-assignment rule. This usually indicates a stale/out-of-order outbox item that needs reconciliation, not a loss of the clinical record.";
  if(s.includes("beds_one_patient")) return "The database detected the patient on more than one bed. This safety constraint is intentionally enforced. The write must be reconciled rather than bypassing the constraint.";
  if(s.includes("relation \"patients\" does not exist")) return "A database function or trigger is referring to patients without the public schema. This is a server-side schema-resolution problem.";
  if(s.includes("permission denied") || s.includes("42501")) return "This device is attempting a direct table read that is intentionally blocked by the controlled-read security boundary. If this appears in an old log entry, it does not by itself mean the current sync is broken.";
  if(s.includes("invalid or expired ward session")) return "The ward session has expired or is no longer valid. Sign in again before retrying clinical writes.";
  if(s.includes("duplicate key")) return "The server rejected a duplicate record. The exact constraint name above identifies which uniqueness rule was triggered.";
  if(s.includes("foreign key")) return "The write references a related record that is missing or not yet available. Check the record IDs and operation order.";
  if(s.includes("handover sender must be the active session resident")) return "Posted by another resident — this login cannot sync it.";
  if(s.includes("not null")) return "A required field was missing from the queued write.";
  return msg ? String(msg).slice(0,160) : "Waiting for the server.";
}

function clinicianCopy(msg,table){
  const s=String(msg||"");
  const low=s.toLowerCase();
  if(/invalid or expired|not signed in|no active ward session/.test(low)) return "Sign in again.";
  if(/only the receiving resident/.test(low)) return "Already taken by someone else, or not addressed to you.";
  if(/handover sender must be/.test(low)) return "This handover belongs to another resident.";
  if(/bed is already occupied/.test(low)) return "Bed taken.";
  if(/hospital number already/.test(low)) return "Hospital number already on file.";
  if(/not under observation/.test(low)) return "That patient is not under observation.";
  if(/already under observation/.test(low)) return "Already under observation.";
  if(/provisional diagnosis is required|at least one medication/.test(low)) return "Diagnosis and at least one medicine are required.";
  if(/destination bed is already occupied|already occupied/.test(low)) return "That bed was taken on another phone.";
  if(/source bed does not contain/.test(low)) return "Patient is no longer on that bed — refresh and try again.";
  if(/already restrained/.test(low)) return "Already restrained — release first.";
  if(/not restrained/.test(low)) return "Not restrained — restrain first.";
  if(/stale/.test(low) && /pull and edit/.test(low)) return "Plan was updated on another phone. Showing latest.";
  if(/discharged patient cannot/.test(low)) return "This patient is already discharged.";
  if(/active patient not found|patient not found/.test(low)) return "That patient is no longer on the ward.";
  if(/consultant is read only|view-only|cannot perform clinical/.test(low)) return "This login is view-only.";
  if(/admin only/.test(low)) return "Ask an admin to change ward setup.";
  if(/handover recipient is required/.test(low)) return "Choose who will receive the handover.";
  if(/duplicate key|already bound/.test(low)) return "Already saved. Pull to refresh if the list looks stale.";
  if(/permission denied|42501/.test(low)) return "This login cannot do that.";
  if(/this action has no approved write path/.test(low)) return "This action cannot sync. Update the app.";
  const clean=s.replace(/^[a-z_]+:\s*/i,"").replace(/\s+/g," ").trim();
  if(clean.length<=90 && !/postgres|sqlstate|violates|null value/.test(low)) return clean;
  if(/notification_events|event_type|check constraint/i.test(s)) return "Team push did not send. The clinical note was saved.";
  return "Could not save. Open Connection if it keeps happening.";
}

   WARD COMMAND v85.12

function wardLocalDayKey(v){
  const d=new Date(v);
  if(Number.isNaN(d.getTime())) return null;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function wardAdmissionInfo(p){
  if(!p||p.status!=="admitted")return null;
  const raw=p?.admittedAt||p?.admitted_at||null;
  if(!raw)return null;
  const d=new Date(raw);
  if(Number.isNaN(d.getTime())||d>new Date())return null;
  const today=wardLocalDayKey(new Date());
  const yesterday=new Date();
  yesterday.setDate(yesterday.getDate()-1);
  const day=wardLocalDayKey(d);
  if(day===today)return {text:"Admitted today",today:true};
  if(day===wardLocalDayKey(yesterday))return {text:"Admitted yesterday",today:false};
  return {text:"Admitted "+d.toLocaleDateString([],{
    day:"2-digit",month:"short",year:"numeric"
  }),today:false};
}
function wardTodayAdmissionCount(){
  const today=wardLocalDayKey(new Date());
  return (S.patients||[]).filter(p=>{
    if(p.status!=="admitted") return false;
    const raw=p?.admittedAt||p?.admitted_at;
    return raw && wardLocalDayKey(raw)===today;
  }).length;
}
function wardTodayDischargeCount(){
  const today=wardLocalDayKey(new Date());
  return (S.patients||[]).filter(p=>{
    const raw=p?.dischargedAt||p?.discharged_at;
    return raw && wardLocalDayKey(raw)===today;
  }).length;
}

function normalizeEctDays(raw){
  const days=(Array.isArray(raw)?raw:[]).map(Number).filter(d=>d>=0&&d<=6);
  return days.length?[...new Set(days)].sort():[2,6];
}
function ectDays(){
  if(Array.isArray(S.ectDays)&&S.ectDays.length) return normalizeEctDays(S.ectDays);
  try{
    const raw=JSON.parse(localStorage.getItem("ward-sync-ect-days")||"[2,6]");
    S.ectDays=normalizeEctDays(raw);
    return S.ectDays.slice();
  }catch(e){
    S.ectDays=[2,6];
    return [2,6];
  }
}
function ectDayNames(days){
  const names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return (days||ectDays()).map(d=>names[d]).join(" · ");
}
function isEctDay(iso){
  const d=iso?new Date(iso):new Date();
  if(isNaN(d)) return false;
  return ectDays().includes(d.getDay());
}
function nextEctAt(afterIso){
  const days=ectDays();
  const after=afterIso?new Date(afterIso):new Date();
  if(isNaN(after)) return null;
  const start=new Date(after);
  start.setHours(8,0,0,0);
  for(let i=0;i<=21;i++){
    const n=new Date(start);
    n.setDate(start.getDate()+i);
    if(!days.includes(n.getDay())) continue;
    if(i===0 && after>=n) continue;
    return n.toISOString();
  }
  return null;
}

function bedSortKey(b){
  const no=String((b&&b.no)||"");
  const m=no.match(/^([A-Za-z]+)\s*-?\s*(\d+)/) || no.match(/(\d+)/);
  return [((S.sections||[]).findIndex(s=>s.id===b.sectionId)+100), m?m[1]||"":"", m?Number(m[2]||m[1]):9999, no];
}
function groupBeds(shown){
  const list=(shown||[]).slice().sort((a,b)=>{
    const ka=bedSortKey(a), kb=bedSortKey(b);
    for(let i=0;i<ka.length;i++) if(ka[i]<kb[i]) return -1; else if(ka[i]>kb[i]) return 1;
    return 0;
  });
  const secs=(S.sections||[]).filter(s=>s.active!==false);
  const groups=[], used=new Set();
  secs.forEach(sec=>{
    const beds=list.filter(b=>b.sectionId===sec.id);
    if(beds.length){groups.push({name:sectionLabel(sec.name),beds});beds.forEach(b=>used.add(b.id))}
  });
  const rest=list.filter(b=>!used.has(b.id));
  if(rest.length) groups.push({name:"Other",beds:rest});
  return groups;
}

  const d=ui.obs||{};
  const hosp=(d.hosp||"").trim(), name=(d.name||"").trim(), dx=(d.dx||"").trim();
  const bed=S.beds.find(b=>b.id===d.bed);

    });
    if(error) throw error;
    if(!data||data.ok===false) throw new Error((data&&data.error)||"Observation was not saved");
    S.patients=S.patients.filter(x=>x.id!==id);
    S.patients.unshift(p);
    bed.patientId=id;

    S.obsStays=S.obsStays||[];
    S.obsStays.unshift({id:stay,pid:id,bedId:bed.id,at:now(),by:S.userId,endedAt:null});
    S.snaps[id]={state:"Under observation.",risk:"moderate",plan:dx,tags:[],at:now(),by:S.userId};
    meds.forEach(m=>S.orders.unshift({id:uid("mo"),pid:id,drug:m.drug,dose:m.dose,route:m.route,freq:m.freq,status:"active",start:now()}));
    ev(id,"Under observation \u00b7 "+bed.no,true,"note");
    ui.obs={meds:[{drug:"",dose:"",route:"PO",freq:"OD"}]};
    toast("Kept under observation","ok");ui.obsForm=false;save();render();
  }catch(e){
    toast(clinicianCopy(e.message||e)||String(e.message||e),"bad");

}

async function convertObservation(pid){
  if(!needWrite())return;
  const p=patient(pid);if(!p||p.status!=="observation")return;
  const from=S.beds.find(b=>b.patientId===pid);
  if(workflowLocked("obs-admit",pid))return;
  setBusy(true,"Admitting\u2026");
  try{
    obsAdmitDraft();
    const d=ui.obsAdmit||{};
    const reasons=(d.reasons||[]).join(",");
    const admittedAt=d.adate?new Date(d.adate).toISOString():now();
    const destId=d.to||null;
    const same=!destId||(from&&from.id===destId);
    const {data,error}=await sb.rpc("ward_convert_observation",{
      p_token:sessionTok,p_patient_id:pid,
      p_to_bed_id:same?null:destId,
      p_assignment:same?{}:{id:uid("as"),at:admittedAt},
      p_details:{
        admitted_at:admittedAt,
        reason_for_admission:reasons||null,
        referred_by:(d.ref||"").trim()||null,
        consultant_name:(d.con||val("oacon")||"").trim()||null,
        diagnosis:(d.dx||"").trim()||null
      }
    });
    if(error) throw error;
    p.status="admitted";
    p.admittedAt=admittedAt;
    p.reason=reasons||p.reason;
    p.referredBy=(d.ref||"").trim()||p.referredBy;
    p.consultant=(d.con||val("oacon")||"").trim()||p.consultant;
    if((d.dx||"").trim()) p.diagnosis=d.dx.trim();
    S.snaps[pid]=Object.assign({},S.snaps[pid]||{},{state:"Admitted from observation.",at:admittedAt,by:S.userId});
    if(!same&&destId&&from){
      from.patientId=null;
      const dest=S.beds.find(b=>b.id===destId); if(dest) dest.patientId=pid;
    }
    const st=(S.obsStays||[]).find(s=>s.pid===pid&&!s.endedAt); if(st){st.endedAt=now();st.outcome="admitted"}
    ev(pid,"Admitted from observation",true,"note");
    try{
      await notifyServerEvent({
        eventType:"admission",category:"clinical",priority:"normal",patientId:pid,
        title:"Admitted from observation",
        body:p.name+" admitted from observation",
        targetUrl:"./#/snap/"+encodeURIComponent(pid),
        recipientScope:"active_team",
        dedupeKey:"admission:"+pid
      });
    }catch(ne){ evFail(pid,"Admission notification",ne); }
    closePanel();toast("Admitted "+p.name,"ok");save();render();
  }catch(e){toast(clinicianCopy(e.message||e)||String(e.message||e),"bad")}
  finally{workflowUnlock("obs-admit",pid);setBusy(false)}
}

}

async function callAtomicWorkflow(name,args){
  if(!sb||!sessionTok)return {used:false};
  const {data,error}=await sb.rpc(name,args);
  if(!error){
    if(data && data.ok===false && data.error){
      const de=data.error||{};
      const err=new Error(de.message||"Admission workflow rejected");
      err.workflow=name;
      err.supabase={code:de.code||null,message:de.message||null,details:de.details||null,hint:de.hint||null,status:de.status??null,context:de.context||null};
      err.message=formatSupabaseError(err.supabase,"Atomic workflow: "+name);
      throw err;
    }
    return {used:true,data};
  }
  const msg=String(error.message||error);
  if(/does not exist|could not find the function|undefined function|42883/i.test(msg)){
    console.warn("Atomic workflow unavailable; using legacy write path",name);
    return {used:false};
  }
  if(sessionDead(msg))expireSession();
  const err=new Error(msg);
  err.workflow=name;

async function dischargeCommit(p,bed,releasedBefore,ect,ectBefore){setBusy(true);
  try{
    const activeAssignments=(S.assignments||[]).filter(a=>a.patientId===p.id&&a.released);
    const atomic=await callAtomicWorkflow("ward_discharge_patient",{
      p_token:sessionTok,p_patient:p,p_bed_id:bed?bed.id:null,
      p_assignment_ids:activeAssignments.map(a=>a.id),
      p_ect_plan:ect&&p.dischargeMode!=="death"?ect:null
    });
    if(!atomic.used){
      const hold=pending.slice(); pending.length=0;
      qPatient(p);if(bed)qBed(bed);activeAssignments.forEach(qAssign);
      if(ect && p.dischargeMode!=="death")qEct(ect);
      const ops=pending.splice(0); pending.push(...hold);
      for(const op of ops) await upsert(op.table,[op.row]);
    }
    try{
      let result;
      if(atomic.used && atomic.data && atomic.data.notification_id){
        result=await dispatchNotificationId(atomic.data.notification_id);
      }else{
        result=await notifyServerEvent({
          eventType:"discharge",category:"clinical",priority:"normal",patientId:p.id,
          title:"Patient discharged",body:p.name+" discharged · "+labelOf(DISCHARGE_MODES,p.dischargeMode),
          targetUrl:"./#/snap/"+encodeURIComponent(p.id),recipientScope:"active_team",
          dedupeKey:"discharge:"+p.id+":"+encodeURIComponent(p.dischargedAt||now()),
          metadata:{bed_number:bed?bed.no:null,discharge_mode:p.dischargeMode,discharge_outcome:p.dischargeOutcome}
        });
      }
      ev(p.id,"Discharge notification dispatched · "+((result.dispatch&&result.dispatch.sent)||0)+" device(s)",true);
    }catch(ne){
      evFail(p.id,"Discharge notification",ne);
      console.warn("Discharge notification failed",ne);
    }
    ev(p.id,"Discharged · "+labelOf(DISCHARGE_MODES,p.dischargeMode)+" · "+labelOf(DISCHARGE_OUTCOMES,p.dischargeOutcome),true,"note");
    flashBtn(".btn.danger.block","ok");toast("Discharged "+p.name,"ok");ui.disId="";ui.disForm=false;save();ui.ctab="out";render();
  }catch(e){
    p.status="admitted"; p.dischargedAt=null; p.dischargeMode=null; p.dischargeOutcome=null; p.treatmentMode=null;
    if(bed)bed.patientId=p.id;
    (S.assignments||[]).forEach(a=>{const old=releasedBefore&&releasedBefore.find(x=>x.id===a.id);if(old)a.released=old.released});
    if(ect&&ectBefore){ect.status=ectBefore.status;ect.nextAt=ectBefore.nextAt;ect.sessionsDone=ectBefore.sessionsDone}
    ev(p.id,"Discharge failed · "+p.name+" · "+(e.message||e),false);
    flashBtn(".btn.danger.block","bad");toast("Discharge failed","bad");save();render();
  }finally{workflowUnlock("discharge",p&&p.id);setBusy(false);}
}

async function markEctDone(id){
  if(!needWrite())return;
  if(!isEctDay()){toast("Sessions can only be recorded on ECT days ("+ectDayNames()+").","bad");return;}
  const e=(S.ect||[]).find(x=>x.id===id);if(!e)return;
  const sessionNumber=(e.sessionsDone||0)+1;
  const session={id:uid("ects"),planId:e.id,pid:e.pid,sessionNumber,at:now(),by:S.userId};
  const oldSessions=e.sessionsDone||0, oldNext=e.nextAt||null;
  e.sessionsDone=sessionNumber;
  e.nextAt=nextEctAt(now())||e.nextAt||null;
  if(!(sb&&sessionTok)){
    S.ectSessions=S.ectSessions||[];S.ectSessions.unshift(session);qEctSession(session);
    ev(e.pid,"ECT session "+sessionNumber,true,"ect");save();render();toast("ECT session queued for sync","ok");return;
  }
  setBusy(true);
  try{
    S.ectSessions=S.ectSessions||[];S.ectSessions.unshift(session);
    const {data:ectResult,error:ectError}=await sb.rpc("ward_record_ect_session",{
      p_token:sessionTok,
      p_row:{
        id:session.id,plan_id:session.planId,patient_id:session.pid,session_at:session.at,
        next_session_at:e.nextAt||null,recorded_by:S.userId||null
      }
    });
    if(ectError) throw ectError;
    if(!ectResult||ectResult.ok!==true) throw new Error("ECT session was not recorded");
    session.sessionNumber=ectResult.session_number||sessionNumber;
    const p=patient(e.pid);
    const result=await notifyServerEvent({eventType:"ect",category:"ect",priority:"high",patientId:e.pid,ectPlanId:e.id,title:"ECT session completed",body:(p?p.name:"Patient")+" · Session "+sessionNumber+" completed",targetUrl:"./#/snap/"+encodeURIComponent(e.pid),recipientScope:"active_team",dedupeKey:"ect:"+e.id+":session:"+session.id,metadata:{action:"session",sessions_done:sessionNumber,next_session_at:e.nextAt||null}});
    ev(e.pid,"ECT session "+sessionNumber,true,"ect");
    ev(e.pid,"ECT notification sent · "+((result.dispatch&&result.dispatch.sent)||0)+" device(s)",true);
    save();render();toast("ECT session recorded · synced","ok");
  }catch(err){
    S.ectSessions=S.ectSessions.filter(x=>x.id!==session.id);
    e.sessionsDone=oldSessions;e.nextAt=oldNext;
    evFail(e.pid,"ECT session",err);save();render();toast(err.message||String(err),"bad");
  }finally{setBusy(false)}
}

        metadata:{action:action||"planned",sessions_done:e.sessionsDone||0,next_session_at:e.nextAt||null,npo:e.npo!==false}
      });

    }catch(ne){

function currentShift(d){
  const dt=d?new Date(d):new Date();
  const h=dt.getHours()+dt.getMinutes()/60;
  if(h>=8 && h<14) return "morning";
  if(h>=14 && h<22) return "evening";
  return "night";
}
function nextShift(s){
  s=s||currentShift();
  return s==="morning"?"evening":s==="evening"?"night":"morning";
}
function shiftHours(s){
  return {morning:"08:00–14:00",evening:"14:00–22:00",night:"22:00–08:00"}[s]||"";
}
function shiftLabel(s){
  return {morning:"Morning",evening:"Evening",night:"Night"}[s]||s||"";
}
function handoverView(){
  const cur=currentShift();

  const me=String(S.userId||"");
  const open=S.handovers.filter(h=>h.status==="sent");
  const mineIncoming=h=>String(h.to||"")===me && String(h.from||"")!==me;
  const mineOutgoing=h=>String(h.from||"")===me;
  const forNow=open.filter(h=>h.shift===cur && mineIncoming(h));
  const forNext=open.filter(h=>h.shift===nxt && (mineOutgoing(h)||mineIncoming(h)));
  const postedByMe=open.filter(h=>mineOutgoing(h) && h.shift!==nxt);
  const other=open.filter(h=>h.shift!==cur&&h.shift!==nxt && mineIncoming(h));
  const acked=S.handovers.filter(h=>h.status==="acknowledged").slice().sort((a,b)=>new Date(b.at||0)-new Date(a.at||0)).slice(0,5);
  const takeN=forNow.reduce((n,h)=>n+S.hitems.filter(i=>i.hid===h.id&&!i.done).length,0);

      </div>

    </div>`;
  return head+
    hoSection("Take this shift",forNow,true,!forNow.length?`<p class="ho-empty-hero">No handovers yet</p>`:"")+

    (postedByMe.length?hoSection("Waiting to be taken",postedByMe,false,""):"")+
    (other.length?hoSection("Other incoming",other,true,""):"")+

function hoSection(title,list,canAck,empty){
  list=list.slice().sort((a,b)=>new Date(b.at||0)-new Date(a.at||0));
  if(!list.length) return empty||"";
  return `<p class="more-section">${esc(title)}</p>`+list.map(h=>hoPack(h,canAck)).join("");
}
function hoWhen(v){
  if(!v) return "—";
  const d=new Date(v);
  if(isNaN(d)) return "—";
  return d.toLocaleString([], {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
}
function hoPack(h,canAck){
  const items=S.hitems.filter(i=>i.hid===h.id&&(onWard(i.pid)||underObs(i.pid))).slice().sort((a,b)=>new Date(b.at||0)-new Date(a.at||0));
  if(!items.length) return "";
  const open=items.filter(i=>!i.done).length;
  const me=String(S.userId||"");
  const recipient=String(h.to||"")===me;
  const giver=String(h.from||"")===me;
  const mine=recipient && !giver;
  const statusLine=h.status==="acknowledged"
    ? `Acknowledged by ${esc(rname(h.ackBy||h.to))} · ${esc(hoWhen(h.ackAt||h.at))}`
    : `Waiting for ${esc(rname(h.to)||"recipient")}`;
  return `<div class="card ho-pack">
    <div class="row">
      <div>
        <b class="sm">From ${esc(rname(h.from))}${h.to&&h.to!==h.from?" → "+esc(rname(h.to)):""}</b>
        <p class="tiny">Posted ${esc(hoWhen(h.at))} · ${items.length} patient${items.length===1?"":"s"} · ${open} open</p>
        <p class="tiny" style="margin-top:4px">${statusLine}</p>
      </div>
    </div>
    ${items.map(i=>`<div class="ho-item ${i.done?"done":""}">
      <div class="row">
        <button class="linkish" onclick="go('snap','${i.pid}')"><b class="sm">${esc(bedOf(i.pid))} · ${esc((patient(i.pid)||{}).name||"")}</b></button>
        <span class="badge p-${i.pri}">${esc(i.pri||"")}</span>
      </div>

      <p class="mustknow">${i.done?"✓ ":""}${esc(i.problem||"")}</p>
      <p class="tiny" style="margin:8px 0 2px">Do</p>
      <p class="shoulddo">${esc(i.action||"—")}</p>
      ${i.done?`<p class="tiny">Done</p>`:(mine?`<button class="btn sm" style="margin-top:8px" onclick="clearItem('${i.id}')" ${i._busy?"disabled":""}>Done</button>`:`<p class="tiny" style="margin-top:8px">Open</p>`)}
    </div>`).join("")}
    ${mine&&canAck&&h.status==="sent"&&canWrite()?`<button class="btn sm" style="margin-top:10px" onclick="ackH('${h.id}')">Take handover</button>`:""}
    ${giver&&h.status==="sent"&&canWrite()?`<button class="btn ghost sm" style="margin-top:10px" onclick="withdrawHandover('${h.id}')">Withdraw pack</button>`:""}
  </div>`;
}

function ackH(id){
  if(!needWrite())return;
  const h=S.handovers.find(x=>x.id===id);if(!h)return;
  if(String(h.from)===String(S.userId)){toast("You cannot take a handover you posted.","bad");return}

  ui.confirm={fn:"ackH",id,title:"Take handover",ok:"Take",danger:false,body:"Take this "+shiftLabel(h.shift)+" handover from "+rname(h.from)+"?"};
  render();

async function ackHNow(id){
  if(!needWrite())return;
  setBusy(true,"Acknowledging handover…");
  const h=S.handovers.find(x=>x.id===id);if(!h)return;
  if(h._busy)return; h._busy=true; render();
  const prev={status:h.status,ackBy:h.ackBy,ackAt:h.ackAt};
  h.status="acknowledged";h.ackBy=S.userId;h.ackAt=now(); save(); render();
  try{
    if(!sessionTok||!sb) throw new Error("Sign in again to sync writes");
    let error=null;
    let take=await sb.rpc("ward_take_handover",{p_session_token:sessionTok,p_handover_id:h.id});
    error=take.error;
    if(error && /function .*ward_take_handover.*does not exist/i.test(error.message||"")){
      take=await sb.rpc("ward_ack_handover",{p_session_token:sessionTok,p_handover_id:h.id});
      error=take.error;
    }
    if(error){
      const msg=error.message||"";
      if(/only the receiving resident/i.test(msg)) throw new Error("Already taken by someone else, or this handover is not addressed to you.");
      if(!/function .*ward_ack_handover.*does not exist/i.test(msg)) throw error;
      await upsert("handovers",[{id:h.id,from_id:h.from,to_id:h.to||h.from,shift:h.shift,status:"acknowledged",created_at:h.at||now(),acknowledged_by:S.userId,acknowledged_at:h.ackAt}]);
    }
    ev(null,"Handover acknowledged · "+shiftLabel(h.shift)+" · "+rname(S.userId),true,"handover");
    toast("Acknowledged "+shiftLabel(h.shift),"ok");
  }catch(e){
    h.status=prev.status;h.ackBy=prev.ackBy;h.ackAt=prev.ackAt;save();evFail(null,"Handover acknowledgement",e);toast("Handover was not acknowledged","bad");
  }finally{h._busy=false;setBusy(false);render();}
}
async function sendH(){
  if(!needWrite())return;
  const pid=val("hp"), problem=val("hpr").trim(), action=val("hac").trim();
  const toShift=val("hshift")||nextShift();
  const toResident=val("hres");
  if(!toResident){toast("Select the resident who will receive this handover.","bad");return}
  if(String(toResident)===String(S.userId||"")){toast("Pick another resident.","bad");return}
  if(!pid||!problem){toast("Choose a patient and write the key risk for the next shift.","bad");return}
  setBusy(true,"Sending handover…");
  let h=S.handovers.find(x=>String(x.from)===String(S.userId)&&String(x.to)===String(toResident)&&x.shift===toShift&&x.status==="sent");
  if(!h){
    h={id:uid("h"),from:S.userId,to:toResident,shift:toShift,status:"sent",at:now()};
    S.handovers.unshift(h);
  } else {
    h.from=S.userId;
    h.to=toResident;
  }
  const it={id:uid("hi"),hid:h.id,pid,pri:"high",problem,action:action||"Review snapshot",done:false,at:now()};
  S.hitems.unshift(it);
  qHandover(h);qHitem(it);
  try{
    if(!sessionTok) throw new Error("Sign in again to sync writes");
    let hhErr=null;
    const hh=await sb.rpc("ward_upsert_handover",{p_session_token:sessionTok,p_row:{id:h.id,to_id:h.to,shift:h.shift,status:"sent",created_at:h.at||now()}}); hhErr=hh.error;
    if(hhErr){if(!/function .*ward_upsert_handover.*does not exist/i.test(hhErr.message||"")) throw hhErr; await upsert("handovers",[{id:h.id,from_id:h.from,to_id:h.to||h.from,shift:h.shift,status:h.status,created_at:h.at||now(),acknowledged_by:h.ackBy||null,acknowledged_at:h.ackAt||null}]);}
    const hi=await sb.rpc("ward_upsert_handover_item",{p_session_token:sessionTok,p_row:{id:it.id,handover_id:it.hid,patient_id:it.pid,priority:it.pri,problem:it.problem,action_required:it.action||"Review snapshot",done:!!it.done}});
    if(hi.error){if(!/function .*ward_upsert_handover_item.*does not exist/i.test(hi.error.message||"")) throw hi.error; await upsert("handover_items",[{id:it.id,handover_id:it.hid,patient_id:it.pid,priority:it.pri,problem:it.problem,action_required:it.action||"Review snapshot",done:!!it.done}]);}
    ev(pid,"Handover to "+shiftLabel(toShift),true,"handover");
    try{
      const p=patient(pid);
      const result=await notifyServerEvent({
        eventType:"handover", category:"handovers", priority:"high", patientId:pid, handoverId:h.id,
        title:"New handover",
        body:(p?p.name:"Patient")+" · "+shiftLabel(toShift)+" handover\n"+problem+(action?"\nAction: "+action:""),
        targetUrl:"./#/handover", recipientScope:"handover",
        dedupeKey:"handover:"+h.id+":"+it.id,
        metadata:{shift:toShift,to_resident_id:toResident,handover_item_id:it.id,action_required:action||"Review snapshot"}
      });
      ev(pid,"Handover notification sent · "+((result.dispatch&&result.dispatch.sent)||0)+" device(s)",true,"handover");
    }catch(ne){
      evFail(pid,"Handover notification",ne);
      toast("Posted for "+shiftLabel(toShift)+" · push not delivered","ok");
      ui.htab="board";save();dismissOverlay();
      return;
    }
    toast("Posted for "+shiftLabel(toShift),"ok");
    ui.htab="board";save();dismissOverlay();
  }catch(e){
    evFail(pid,"Handover",e);
    toast("Handover was not saved: "+(e.message||e),"bad");
    save();render();
  }finally{
    setBusy(false);
  }
}

async function saveUserEdit(){

  const name=(val("ed")||"").trim();

function broadcastAudience(){return (ui.bcast&&ui.bcast.aud)||"everyone";}
function broadcastSuggest(text){
  const m=String(text||"").match(/(^|\s)([#@])([A-Za-z0-9][A-Za-z0-9 .\-]{0,24})$/);
  if(!m) return [];
  const kind=m[2], q=m[3].trim().toLowerCase();
  if(!q) return [];
  if(kind==="#"){
    return (S.beds||[]).filter(b=>b.active!==false && String(b.no||"").toLowerCase().includes(q))
      .slice(0,8).map(b=>{
        const p=b.patientId?patient(b.patientId):null;
        return {kind:"#", token:String(b.no), pid:p&&p.id||null, label:b.no+(p?" · "+p.name:" · empty")};
      });
  }
  return (S.patients||[]).filter(p=>(p.status==="admitted"||p.status==="observation") && String(p.name||"").toLowerCase().includes(q))
    .slice(0,8).map(p=>{
      const b=(S.beds||[]).find(x=>x.patientId===p.id);
      return {kind:"@", token:p.name, pid:p.id, label:(b?b.no+" · ":"")+p.name};
    });
}
function pickBroadcastTag(kind,token,pid,label){
  const t=(ui.bcast&&ui.bcast.text)||"";
  ui.bcast=ui.bcast||{};
  ui.bcast.text=t.replace(/(^|\s)([#@])([A-Za-z0-9][A-Za-z0-9 .\-]{0,24})$/, `$1${kind}${token} `);
  ui.bcast.tag={id:pid||null,label:label||token};
  render();
  setTimeout(()=>{const el=document.getElementById("bcasttxt"); if(el){el.focus(); el.selectionStart=el.selectionEnd=el.value.length;}},30);
}
function resolveBroadcastTag(text){
  const raw=String(text||"");
  const bedm=raw.match(/#([A-Za-z]{1,4}-?\d{1,3})\b/);
  if(bedm){
    const key=bedm[1].replace(/-/g,"").toUpperCase();
    const bed=(S.beds||[]).find(b=>String(b.no||"").replace(/-/g,"").toUpperCase()===key || String(b.no||"").toUpperCase()===bedm[1].toUpperCase());
    if(bed&&bed.patientId){
      const p=patient(bed.patientId);
      if(p) return {id:p.id,label:(bed.no||"")+" \u00b7 "+(p.name||"Patient")};
    }
  }
  const namem=raw.match(/@([A-Za-z][A-Za-z .]{1,40})/);
  if(namem){
    const q=namem[1].trim().toLowerCase();
    const p=(S.patients||[]).find(x=>(x.status==="admitted"||x.status==="observation") && String(x.name||"").toLowerCase().includes(q));
    if(p){
      const b=(S.beds||[]).find(x=>x.patientId===p.id);
      return {id:p.id,label:(b?b.no+" \u00b7 ":"")+(p.name||"Patient")};
    }
  }
  return {id:null,label:null};
}

async function sendBroadcast(){
  if(!needWrite())return;
  const body=(ui.bcast&&ui.bcast.text||"").trim();
  if(!body){toast("Write a message first","bad");return;}
  if(body.length>400){toast("Keep it under 400 characters","bad");return;}
  const aud=broadcastAudience();
  const tag=resolveBroadcastTag(body);
  const id=uid("bc");
  setBusy(true,"Sending\u2026");
  try{
    const {data,error}=await sb.rpc("ward_broadcast_send",{
      p_session_token:sessionTok,p_id:id,p_body:body,p_audience:aud,
      p_patient_id:tag.id,p_patient_label:tag.label
    });
    if(error) throw error;
    const nid=data&&data.notification_id;
    if(nid){
      try{
        await fetch(S.supabaseUrl.replace(/\/$/,"")+"/functions/v1/dispatch-notification",{
          method:"POST",
          headers:{"Content-Type":"application/json","apikey":S.supabaseAnonKey,"Authorization":"Bearer "+S.supabaseAnonKey},
          body:JSON.stringify({notification_id:nid,session_token:sessionTok})
        });
      }catch(e){}
    }
    ui.bcast={aud,text:""};
    await loadBroadcasts();
    toast("Broadcast sent","ok");
  }catch(e){toast(clinicianCopy?clinicianCopy(e.message||e): (e.message||"Could not send"),"bad");}
  finally{setBusy(false);render();}
}

  const d=new Date(v); if(isNaN(d)) return "";
  const p=n=>String(n).padStart(2,"0");
  return p(d.getDate())+"-"+p(d.getMonth()+1)+"-"+d.getFullYear();
}

  return String(raw).split(",").map(k=>{
    const lab=labelOf(ADMIT_REASONS,k.trim());
    return lab&&lab!=="—"?lab:k.trim();
  }).filter(Boolean).join("; ");
}
function reportHeaders(){
  return ["S. No.","Hospital No.","Date of admission","Consultant","Patient name","Age","Sex","Address","Phone no.","Referred by","Reason for referral","Diagnosis","Mode of treatment","Date of discharge","Outcome"];
}
function obsStaysOf(pid){
  return (S.obsStays||[]).filter(s=>s.pid===pid);
}
function wasAdmittedFromObservation(p){
  return obsStaysOf(p.id).some(s=>(s.outcome||"")==="admitted");
}
function reportablePatient(p){
  if(!p) return false;
  if(p.status==="observation") return false;
  const stays=obsStaysOf(p.id);
  if(!stays.length) return true;
  return wasAdmittedFromObservation(p);
}
function reportAdmitAt(p){
  const stays=obsStaysOf(p.id).filter(s=>(s.outcome||"")==="admitted")
    .sort((a,b)=>new Date(b.endedAt||b.at||0)-new Date(a.endedAt||a.at||0));
  if(stays[0] && stays[0].endedAt) return stays[0].endedAt;
  return p.admittedAt;
}
function reportRow(p,i){
  return [
    i,
    p.hospitalNo||p.code||"",
    dmy(reportAdmitAt(p)),
    consultantLine(p),
    p.name||"",
    p.age||"",
    sexLabel(p.sex),
    (p.address||"").trim(),
    (p.phone||"").trim(),
    p.referredBy||"",
    reasonLine(p),
    p.diagnosis||"",
    treatLabel(p.treatmentMode),
    dmy(p.dischargedAt),
    p.dischargedAt?(labelOf(DISCHARGE_OUTCOMES,p.dischargeOutcome)||p.dischargeOutcome||""):""
  ];
}
function inMonth(v,start,end){
  if(!v) return false;
  const d=new Date(v); if(isNaN(d)) return false;
  return d>=start && d<end;
}
function downloadSheet(filename,sheets){
  if(window.XLSX){
    const wb=XLSX.utils.book_new();
    sheets.forEach(([name,aoa])=>{
      const ws=XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"]=reportHeaders().map((h,i)=>({wch:i===4||i===3||i===7||i===11?22:i===8||i===10?18:14}));
      XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31));
    });
    XLSX.writeFile(wb,filename.replace(/\.csv$/,".xlsx"));
    return;
  }
  const aoa=sheets[0][1];
  const csv=aoa.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=filename.replace(/\.xlsx$/,".csv");
  a.click();
}
function exportMonthly(){
  const ym=(ui.reportMonth&&/^\d{4}-\d{2}$/.test(ui.reportMonth))?ui.reportMonth:new Date().toISOString().slice(0,7);
  const [yy,mm]=ym.split("-").map(Number);
  const start=new Date(yy,mm-1,1); start.setHours(0,0,0,0);
  const end=new Date(yy,mm,1);
  const unit=(S.unit&&S.unit.name)||"Psychiatry Ward";
  const admitted=S.patients.filter(p=>reportablePatient(p)&&inMonth(reportAdmitAt(p),start,end))
    .sort((a,b)=>new Date(reportAdmitAt(a))-new Date(reportAdmitAt(b)));
  const discharged=S.patients.filter(p=>reportablePatient(p)&&inMonth(p.dischargedAt,start,end))
    .sort((a,b)=>new Date(a.dischargedAt)-new Date(b.dischargedAt));
  const inWard=admitted.filter(p=>p.status!=="discharged");
  const deaths=discharged.filter(p=>(p.dischargeMode||"")==="death"||(p.dischargeOutcome||"")==="death");
  const xfers=(S.events||[]).filter(e=>{
    const ok=e.ok!==false && /transferred/i.test(e.title||"") && !/fail/i.test(e.title||"");
    const p=e.pid?patient(e.pid):null;
    return ok && inMonth(e.at,start,end) && (!p || reportablePatient(p));
  }).sort((a,b)=>new Date(a.at)-new Date(b.at));

  const banner=(title,n)=>[
    [unit],[title+" · "+ym],["Generated "+dmy(now())+" · "+n+" row(s)"],[],
    reportHeaders()
  ];
  const pack=(title,list)=>banner(title,list.length).concat(list.map((p,i)=>reportRow(p,i+1)));
  const xferSheet=[
    [unit],["Transfers · "+ym],["Generated "+dmy(now())],[],
    ["S. No.","Date","Hospital No.","Patient name","Bed move","Resident"],
    ...xfers.map((e,i)=>{
      const p=e.pid?patient(e.pid):null;
      return [i+1,dmy(e.at),p?(p.hospitalNo||p.code):"",p?p.name:"",e.title.replace(/^Transferred\s*/i,""),rname(e.by)];
    })
  ];
  const summary=[
    [unit],["Monthly ward report · "+ym],["Generated "+dmy(now())],[],
    ["Item","Count"],
    ["Admissions this month",admitted.length],
    ["Still in ward (of this month)",inWard.length],
    ["Discharges this month",discharged.length],
    ["Deaths this month",deaths.length],
    ["Transfers this month",xfers.length]
  ];
  downloadSheet("ward-report-"+ym+".xlsx",[
    ["Summary",summary],
    ["Monthly register",pack("Admissions this month",admitted)],
    ["Still in ward",pack("Still in ward",inWard)],
    ["Discharges",pack("Discharges this month",discharged)],
    ["Deaths",pack("Deaths this month",deaths)],
    ["Transfers",xferSheet]
  ]);
  toast("Report "+ym+" downloaded","ok");
}


async function runDiagnostics(){
  const out=[];
  const note=(ok,msg)=>{out.push({ok,msg}); if(!ok) pushElog(msg,"bad")};
  const c=outboxCounts();
  note(!!sessionTok,"Authentication "+(sessionTok?"session on":"no token"));
  note(!!sb,"Database "+(sb?"ready":"missing"));
  note(liveReady,"Realtime "+(liveReady?"subscribed":"down")+" · listening="+!!Sync.listening);
  note(!c.failed,"Sync "+(Sync.state||"?"));
  note(!c.pending,"Pending "+c.pending);
  note(!c.retrying,"Retrying "+c.retrying);
  note(!c.failed,"Failed "+c.failed);
  note(true,"Last server "+(Sync.lastServer?rel(Sync.lastServer):"—"));
  note(true,"Last realtime "+(Sync.lastRealtime?rel(Sync.lastRealtime):"—"));
  note(true,"Reconnects "+Sync.reconnects+" · deferred="+!!reconciliationNeeded);
  (Sync.log||[]).slice(0,8).forEach(l=>note(true,l));

  if(!S.supabaseUrl||!S.supabaseAnonKey){note(false,"No URL or anon key on this device"); ui.diag=out; toast("Missing keys","bad"); render(); return}
  if(!/^https:\/\//i.test(S.supabaseUrl)){note(false,"URL is not https"); ui.diag=out; render(); return}
  note(true,"URL "+S.supabaseUrl.replace("https://",""));
  note(true,"Key length "+S.supabaseAnonKey.length);
  note(navigator.onLine,"Browser network "+(navigator.onLine?"online":"offline"));
  note(!!window.supabase,"Supabase JS "+(window.supabase?"loaded":"missing"));
  // v87.3 intentionally revokes direct browser SELECT privileges.
  // Diagnostics therefore exercise the controlled session RPC rather than
  // calling REST table endpoints directly.
  try{
    if(!sessionTok) throw new Error("No active ward session");
    const t0=performance.now();
    const {data,error}=await sb.rpc("ward_read_ward_state",{p_session_token:sessionTok});
    const ms=Math.round(performance.now()-t0);
    note(!error && !!data?.ok,"Controlled ward read RPC in "+ms+" ms");
    if(error) note(false,"ward_read_ward_state: "+error.message);
  }catch(e){note(false,"Controlled read failed: "+(e.message||e))}
  note(!!sb,"Client instance "+(sb?"ready":"not created"));
  note(liveReady,"Realtime "+(liveReady?"subscribed":"not live")+" · status "+(cloudStatus||"—"));
  if(cloudLastError) note(false,"Last sync: "+cloudLastError);
  ui.diag=out;
  const bad=out.filter(x=>!x.ok).length;
  toast(bad?"Diagnostics: "+bad+" issue(s)":"Cloud checks passed",bad?"bad":"ok");
  render();
}

function activityView(){
  if(ui.akind==="status") ui.akind="pgt";

  const kind=ui.akind||"all";

    const p=e.pid?patient(e.pid):null;
    const hay=((e.title||"")+" "+(p?p.name:"")+" "+bedOf(e.pid||"")+" "+rname(e.by)+" "+(e.actorName||"")).toLowerCase();
    return !q||hay.includes(q);
  };
  const pairs=pairRestrainEvents((S.events||[]).filter(matchQ));
  const pairIds=new Set();
  pairs.forEach(pr=>{if(pr.on)pairIds.add(pr.on.id);if(pr.off)pairIds.add(pr.off.id)});
  const others=(S.events||[]).filter(e=>{
    if(pairIds.has(e.id)||eventKind(e)==="restrain") return false;
    const k=eventKind(e);
    if(kind==="restrain") return false;
    if(kind!=="all"&&k!==kind) return false;
    return matchQ(e);
  });
  const items=[];
  if(kind==="all"||kind==="restrain"){
    pairs.forEach(pr=>items.push({t:new Date(((pr.off||pr.on||{}).at)||0).getTime(),html:restrainPairCard(pr)}));
  }
  others.forEach(e=>{
    const p=e.pid?patient(e.pid):null;
    const k=eventKind(e);
    items.push({t:new Date(e.at||0).getTime(),html:`<button class="card" style="${k==="fail"?"border-color:#e11d48":""}" onclick="${p?`go('snap','${p.id}')`:""}">
        <div class="row">
          <span class="badge" style="background:${colorSafe(k)};color:#082018">${kindLabel(k)}</span>${(e.ok===false||k==="fail")?`<span class="badge" style="background:#e11d48;color:#fff">failed</span>`:""}
          <span class="tiny">${rel(e.at)}</span>
        </div>
        <p class="sm" style="margin-top:6px"><b>${esc(e.title)}</b></p>
        <p class="tiny">${p?esc(bedOf(p.id)||e.bed||"—")+" · "+esc(p.name||e.patientName||"Patient")+" · ":e.pid?"Patient missing · ":""}${esc(e.actorName||rname(e.by)||"Unknown")}</p>
      </button>`});
  });
  items.sort((a,b)=>b.t-a.t);
  const chips=[["all","All"],["fail","Failed"],["pgt","PGT"],["restrain","Restrain"],["med","Meds"],["ect","ECT"],["handover","Handover"],["task","Tasks"]];
  return `<div class="act-log"><button class="back" onclick="back()">← Back</button>

    ${items.length?items.map(x=>x.html).join(""):`<div class="card"><p class="sm">No matching events.</p></div>`}
  </div>`;
}

          .replace(/</g,"&lt;").replace(/>/g,"&gt;")

        const re=/(<button\b[^>]*\bid="tsk_to"[^>]*data-val=")[^"]*("[^>]*>)(\s*<span>)[\s\S]*?(<\/span>)/i;
        if(re.test(ui.sheet)){

function pgtNotes(id){
  const sn=S.snaps[id]||{};
  const fromSnap=Array.isArray(sn.notes)?sn.notes.slice():[];
  const fromLog=(S.events||[]).filter(e=>e.pid===id&&(e.kind==="pgt"||/^pgt note/i.test(e.title||""))).map(e=>({
    at:e.at,by:e.by,byName:e.actorName||rname(e.by),text:e.detail||e.title||""
  }));
  const seen=new Set();
  const all=fromSnap.concat(fromLog).filter(n=>{
    const k=(n.at||"")+"|"+(n.text||"");

    seen.add(k);return true;
  }).sort((a,b)=>new Date(b.at||0)-new Date(a.at||0));
  return all;
}

function recKindLabel(k){
  return ({admit:"ADMISSION",obs:"OBSERVATION",med:"MEDICATION",ect:"ECT",pgt:"PGT NOTE",crit:"CRITICAL",xfer:"TRANSFER",dis:"DISCHARGE",restrain:"RESTRAINT",handover:"HANDOVER",task:"TASK",note:"EVENT"}[k]||"EVENT");
}
function recCss(k){return ({admit:"admit",obs:"obs",med:"med",ect:"ect",pgt:"pgt",crit:"crit",xfer:"xfer",dis:"dis",restrain:"restrain"}[k]||"note")}
function recActor(it){const n=it.byName||rname(it.by)||"";return n==="?"?"":n}

function medEventActor(pid,drug,at,verbs){
  const d=String(drug||"").toLowerCase();
  const ts=Date.parse(at||0)||0;
  const verbsL=(verbs||[]).map(v=>v.toLowerCase());
  let best=null,bestDt=1e15;
  (S.events||[]).forEach(e=>{
    if(String(e.pid)!==String(pid)) return;
    const title=String(e.title||"").toLowerCase();
    if(d && title.indexOf(d)<0) return;
    if(!verbsL.some(v=>title.startsWith(v)||title.indexOf(v)>=0)) return;
    const dt=Math.abs((Date.parse(e.at||0)||0)-ts);
    if(dt<bestDt){bestDt=dt;best=e;}
  });
  if(!best) return {by:null,byName:""};
  return {by:best.by||null,byName:best.actorName||""};
}

function recSkipEventTitle(title){
  const s=(title||"").toLowerCase();
  return /notification (dispatched|sent)/.test(s) || /^failed\b/.test(s) || /^admission notification|^discharge notification|^transfer notification|^ect notification|^task notification|^handover notification|^critical status update sent/.test(s);
}
function patientRecordItems(pid){
  const p=patient(pid); if(!p) return [];
  const items=[];
  const seen=new Set();
  const mark=function(title,at){
    const key=String(title||"").toLowerCase().replace(/\s+/g," ")+"|"+String(at||"").slice(0,16);
    if(seen.has(key)) return true;
    seen.add(key); return false;
  };
  const add=function(it){
    if(!it||!it.at) return;
    if(mark(it.title,it.at)) return;
    items.push(it);
  };
  (S.obsStays||[]).filter(s=>s.pid===pid).forEach(s=>{
    add({kind:"obs",title:"Kept under observation",at:s.at,by:s.by,body:[s.reason,s.note].filter(Boolean).join(" · ")});
    if(s.endedAt){
      let title="Observation ended";
      if(s.outcome==="admitted") title="Admitted from observation";
      else if(s.outcome==="referred") title="Referred"+(s.referralTo?" to "+s.referralTo:"");
      else if(s.outcome==="disposed") title="Disposed from observation";
      else if(s.outcome) title="Observation ended · "+s.outcome;
      add({kind:"obs",title:title,at:s.endedAt,by:s.endedBy,body:s.referralReason||""});
    }
  });
  if(p.admittedAt && p.status!=="observation"){
    const assigns=(S.assignments||[]).filter(a=>String(a.patientId)===String(pid)).slice().sort((a,b)=>Date.parse(a.at||0)-Date.parse(b.at||0));
    const firstA=assigns[0];
    const bed=firstA?((S.beds||[]).find(x=>x.id===firstA.bedId)||{}).no:bedOf(pid);
    const bits=[];
    if(p.hospitalNo||p.code) bits.push("Hospital no: "+(p.hospitalNo||p.code));
    if(p.diagnosis) bits.push("Diagnosis: "+p.diagnosis);
    if(p.consultant) bits.push("Consultant: "+p.consultant);
    if(p.referredBy) bits.push("Source: "+p.referredBy);
    if(p.reason) bits.push("Reason: "+p.reason);
    if(p.address||p.phone) bits.push([p.address,p.phone].filter(Boolean).join(" · "));
    const evAct=((S.events||[]).filter(e=>String(e.pid)===String(pid)&&/admitted to|admission\b|admitted from/i.test(e.title||"")).sort((a,b)=>Math.abs(Date.parse(a.at||0)-Date.parse(p.admittedAt||0))-Math.abs(Date.parse(b.at||0)-Date.parse(p.admittedAt||0)))[0])||{};
    const by=p.by||evAct.by||(firstA&&firstA.by)||null;
    const byName=(evAct.actorName&&evAct.actorName!=="?")?evAct.actorName:"";
    add({kind:"admit",title:bed?("Admitted to "+bed):"Admitted",at:p.admittedAt||(firstA&&firstA.at),by:by,byName:byName,body:bits.join("\n")});
  }
  const meds=(S.orders||[]).filter(o=>o.pid===pid && !isPrn(o));
  const starts=meds.filter(o=>o.start||o.at).slice().sort((a,b)=>Date.parse(a.start||a.at||0)-Date.parse(b.start||b.at||0));
  if(starts.length){
    const first=starts[0];
    const started=medEventActor(pid,first.drug,first.start||first.at,["started ","medication started"]);
    const lines=starts.map(o=>[o.drug,o.dose,o.route||"PO",o.freq||"OD"].filter(Boolean).join(" · "));
    add({kind:"med",title:"Medications started",at:first.start||first.at,by:first.by||started.by,byName:first.byName||started.byName,body:lines.join("\n")});
  }
  meds.forEach(o=>{
    const label=[o.drug,o.dose,o.route||"PO",o.freq||"OD"].filter(Boolean).join(" · ");
    if(o.hold){
      const paused=medEventActor(pid,o.drug,o.hold,["paused ","medication paused"]);
      add({kind:"med",title:"Medication paused · "+(o.drug||""),at:o.hold,by:paused.by,byName:paused.byName,body:label});
    }
    if(o.stop){
      const stopped=medEventActor(pid,o.drug,o.stop,["stopped ","medication stopped"]);
      add({kind:"med",title:"Medication stopped · "+(o.drug||""),at:o.stop,by:stopped.by,byName:stopped.byName,body:label});
    }
  });
  (S.ect||[]).filter(e=>e.pid===pid).forEach(e=>{
    add({kind:"ect",title:"ECT planned",at:e.at||e.nextAt,by:e.by,body:[e.indication, (e.sessionsDone?e.sessionsDone+" session(s) recorded":"")].filter(Boolean).join(" · ")});
  });
  (S.ectSessions||[]).filter(s=>s.pid===pid).forEach(s=>{
    add({kind:"ect",title:"ECT session "+(s.sessionNumber||""),at:s.at,by:s.by,body:""});
  });
  pgtNotes(pid).forEach(n=>{
    add({kind:"pgt",title:"PGT note",at:n.at,by:n.by,byName:n.byName,body:n.text||""});
  });
  (S.criticalStatusUpdates||[]).filter(x=>String(x.pid)===String(pid)).forEach(c=>{
    add({kind:"crit",title:"Critical status",at:c.at||c.created_at||c.updated_at,by:c.by||c.actor,byName:c.byName||c.actorName,body:c.text||c.value||c.note||c.body||""});
  });
  if(p.dischargedAt){
    const mode=p.dischargeMode||"";
    const out=p.dischargeOutcome||"";
    add({kind:"dis",title:"Discharge",at:p.dischargedAt,body:[mode,out].filter(Boolean).join(" · ")});
  }
  (S.events||[]).filter(e=>e.pid===pid).forEach(e=>{
    if(recSkipEventTitle(e.title)) return;
    const title=e.title||"Event";
    const low=title.toLowerCase();
    if(/^(started |stopped |paused |resumed |pgt note|ect planned|ect session|admitted from observation|under observation|kept under observation|observation ended|admission\b|admitted to\b)/.test(low)) return;
    let kind=e.kind||evKind(title);
    if(/transfer/.test(low)) kind="xfer";
    else if(/discharg/.test(low)) kind="dis";
    else if(/restrain/.test(low)) kind="restrain";
    else if(kind==="status") kind="crit";
    add({kind:kind||"note",title:title,at:e.at,by:e.by,byName:e.actorName,body:e.detail||""});
  });
  items.sort((a,b)=>{
    const rank=it=>it.kind==="admit"?0:(it.title==="Medications started"?1:2);
    const ra=rank(a), rb=rank(b);
    if(ra!==rb) return ra-rb;
    return Date.parse(a.at||0)-Date.parse(b.at||0);

async function toggleRestrainNow(id){
  if(!needWrite())return;
  const sn=S.snaps[id]||(S.snaps[id]={risk:"low",state:"",sleep:"",watch:"",plan:"",tags:[],notes:[]});
  if(sn._restrainBusy)return;
  sn._restrainBusy=true;
  setBusy(true,"Updating restraint…");
  try{
    if(sessionTok&&navigator.onLine){
      try{
        const st=await sb.rpc("ward_restrain_state",{p_token:sessionTok,p_patient_id:id});
        if(st&&st.data&&typeof st.data.held==="boolean"){
          const cur=new Set(sn.tags||[]);
          if(st.data.held) cur.add("restrained"); else cur.delete("restrained");
          sn.tags=[...cur];
        }
      }catch(e){}
    }
    const held=restrainHeld(id);
    const on=!held;
    if(on&&held){toast("Already restrained — release first.","bad");render();return}
    if(!on&&!held){toast("Not restrained — restrain first.","bad");render();return}
    const cur=new Set(sn.tags||[]);
    if(on) cur.add("restrained"); else cur.delete("restrained");
    sn.tags=[...cur];sn.at=now();sn.by=S.userId;
    const p=patient(id);
    const detail=(p?p.name+" · ":"")+(bedOf(id)||"");
    const evn=ev(id,on?"Restrained":"Restraint released",true,"restrain",detail);
    qRestrainToggle(id,on,evn.id,detail);
    save();render();
    try{
      await flushPending();
    }catch(e){
      toast(clinicianCopy(e&&e.message||e)||"Could not save restraint.","bad");
    }
    try{
      await notifyServerEvent({
        eventType:"restrain",category:"clinical",priority:"high",patientId:id,
        title:on?"Patient restrained":"Restraint released",
        body:(p?p.name:"Patient")+" · "+(bedOf(id)||"")+" · "+((user()&&user().displayName)||""),
        targetUrl:"./#/snap/"+encodeURIComponent(id),
        recipientScope:"active_team",
        dedupeKey:"restrain-"+id+"-"+(on?"on":"off")+"-"+Date.now(),
        metadata:{restrained:on}
      });
    }catch(e){
      console.warn(e);
      toast("Restraint saved. Team push did not send.","bad");
    }
  }finally{sn._restrainBusy=false;setBusy(false);render()}
}

async function createCriticalStatusRecord(pid,msg){

  const {data,error}=await sb.rpc("ward_create_critical_status_update",{
    p_session_token:sessionTok,p_patient_id:pid,p_message:msg
  });
  if(error) throw new Error(error.message||String(error));
  const row=Array.isArray(data)?data[0]:data;
  const updateId=row&&(row.id||row.update_id);
  if(!row||!updateId) throw new Error("Critical status update was not saved");
  S.criticalStatusUpdates=S.criticalStatusUpdates||[];
  S.criticalStatusUpdates.unshift({
    id:updateId,
    pid:row.patient_id||pid,
    message:row.message||msg,
    by:row.created_by||S.userId,
    byName:row.created_by_name||((S.residents||[]).find(x=>String(x.id)===String(row.created_by||S.userId))||{}).displayName||((S.residents||[]).find(x=>String(x.id)===String(row.created_by||S.userId))||{}).username||S.userName||((user&&user()||{}).displayName)||"Clinician",
    at:row.created_at||now()
  });
  save();

}

async function bulkBeds(){

  const label=(S.sections.find(s=>s.id===sec)||{}).name||"ward";

function doTransfer(pid,bedId){
  if(!needWrite())return;
  const p=patient(pid);if(!p||p.status==="discharged")return;
  if(workflowLocked("transfer",pid))return;
  const dest=S.beds.find(b=>b.id===bedId);
  if(!dest||!dest.active){toast("That bed is not available.","bad");return}
  if(dest.patientId && dest.patientId!==pid){
    const occ=patient(dest.patientId);
    toast("Bed "+dest.no+" is already occupied"+(occ?" by "+occ.name:"")+".","bad");
    return;
  }
  const from=S.beds.find(b=>b.patientId===pid);
  if(from&&from.id===dest.id){dismissOverlay();return}
  const when=now();
  if(from){
    from.patientId=null;
    qBed(from);
  }
  S.assignments.forEach(a=>{
    if(a.patientId===pid&&!a.released){a.released=when;qAssign(a)}
  });
  dest.patientId=pid;
  qBed(dest);
  const asg={id:uid("as"),patientId:pid,bedId:dest.id,at:when,released:null,by:S.userId};
  S.assignments.unshift(asg);
  qAssign(asg);
  transferCommit(p,from,dest,asg);
}
async function transferCommit(p,from,dest,asg){setBusy(true);
  try{
    const releasedAssignments=S.assignments.filter(a=>a.id!==asg.id && a.patientId===p.id && a.released);
    const occupiedDestAssignments=S.assignments.filter(a=>a.id!==asg.id && a.bedId===dest.id && !a.released);
    const atomic=await callAtomicWorkflow("ward_transfer_patient",{
      p_token:sessionTok,p_patient_id:p.id,p_from_bed_id:from?from.id:null,p_to_bed_id:dest.id,
      p_assignment:asg,p_release_assignment_ids:releasedAssignments.map(a=>a.id),
      p_release_destination_assignment_ids:occupiedDestAssignments.map(a=>a.id)
    });
    if(!atomic.used){
      const hold=pending.slice(); pending.length=0;
      if(from) qBed(from);qBed(dest);releasedAssignments.forEach(qAssign);
      occupiedDestAssignments.forEach(a=>{a.released=asg.at;qAssign(a)});qAssign(asg);
      const ops=pending.splice(0); pending.push(...hold);
      const closes=ops.filter(o=>o.table==="patient_bed_assignments" && o.row.released_at);
      const rest=ops.filter(o=>!(o.table==="patient_bed_assignments" && o.row.released_at));
      for(const op of closes.concat(rest)) await upsert(op.table,[op.row]);
    }
    try{
      let result;
      if(atomic.used && atomic.data && atomic.data.notification_id){
        result=await dispatchNotificationId(atomic.data.notification_id);
      }else{
        result=await notifyServerEvent({
          eventType:"transfer",category:"clinical",priority:"normal",patientId:p.id,
          title:"Patient transferred",body:p.name+" transferred "+(from?from.no:"—")+" → "+dest.no,
          targetUrl:"./#/snap/"+encodeURIComponent(p.id),recipientScope:"active_team",
          dedupeKey:"transfer:"+p.id+":"+dest.id+":"+asg.at,
          metadata:{from_bed_id:from?from.id:null,from_bed_number:from?from.no:null,to_bed_id:dest.id,to_bed_number:dest.no}
        });
      }
      ev(p.id,"Transfer notification dispatched · "+((result.dispatch&&result.dispatch.sent)||0)+" device(s)",true);
    }catch(ne){
      evFail(p.id,"Transfer notification",ne);
      console.warn("Transfer notification failed",ne);
    }
    ev(p.id,"Transferred "+(from?from.no:"—")+" → "+dest.no,true,"note");
    toast((from?from.no:"—")+" → "+dest.no,"ok");save();dismissOverlay();
  }catch(e){
    dest.patientId=null;
    if(from) from.patientId=p.id;
    S.assignments=S.assignments.filter(a=>a.id!==asg.id);
    ev(p.id,"Transfer failed · "+(from?from.no:"—")+" → "+dest.no+" · "+(e.message||e),false);
    const msg=String(e.message||e||"");
    toast(/already occupied/i.test(msg)?"Bed "+dest.no+" was taken on another phone.":"Transfer failed","bad");save();render();
  }finally{workflowUnlock("transfer",p&&p.id);setBusy(false);}
}
