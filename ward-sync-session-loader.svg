<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Ward Sync animated medical heart ECG">
  <style>
    @keyframes upperLogoFadeOut { 0% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes ecgScrollRight { 0% { transform: translate3d(-72px, 0, 0); } 100% { transform: translate3d(0px, 0, 0); } }
    @keyframes heartGentlePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    #upper-logo { opacity: 1; animation: upperLogoFadeOut 0.60s ease-out 400ms 1 forwards; will-change: opacity; }
    .ecg-wave-track { transform: translate3d(-72px, 0, 0); animation: ecgScrollRight 2.5s linear infinite; will-change: transform; }
    .heart-pulse-group { transform-origin: 0px 0px; animation: heartGentlePulse 2.4s ease-in-out infinite; will-change: transform; }
    @media (prefers-reduced-motion: reduce) { #upper-logo,.ecg-wave-track,.heart-pulse-group { animation:none!important; } #upper-logo { opacity:0; } }
  </style>
